<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS UI</title>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: sans-serif; }
        .jarvis-core { width: 180px; height: 180px; border-radius: 50%; border: 4px solid #00f0ff; box-shadow: 0 0 20px #00f0ff, inset 0 0 20px #00f0ff; animation: pulse 1.5s infinite alternate; display: flex; justify-content: center; align-items: center; position: relative; }
        .jarvis-ring { width: 140px; height: 140px; border-radius: 50%; border: 2px dashed #00f0ff; animation: rotate 4s linear infinite; position: absolute; }
        .jarvis-center { width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle, #00f0ff 0%, #005577 100%); box-shadow: 0 0 30px #00f0ff; }
        .status { position: absolute; bottom: 15%; color: #00f0ff; font-weight: bold; letter-spacing: 2px; text-shadow: 0 0 10px #00f0ff; text-transform: uppercase; font-size: 14px; }
        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.7; } 100% { transform: scale(1.05); opacity: 1; } }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="jarvis-core">
        <div class="jarvis-ring"></div>
        <div class="jarvis-center"></div>
    </div>
    <div class="status" id="status">In ascolto...</div>
</body>
</html>
